<body>

    <!-- Tela de carregamento da chuva binária -->
    <div id="binary-overlay"></div>

    <!-- Interface Principal do Terminal -->
    <div id="main-content">
        <div class="terminal-header">
            root@fsociety:~# ./connect_ai_overlord.sh
        </div>
        
        <div id="terminal-body">
            <div class="console-line system-line">[ SYSTEM ] Estabelecendo túnel seguro via rede Tor...</div>
            <div class="console-line system-line">[ SYSTEM ] Conexão encriptada. Terminal pronto.</div>
            <div class="console-line ai-line"><b>[IA]:</b> Olá, amigo. Eu sei quem você é. O que vamos derrubar hoje?</div>
        </div>

        <div class="input-area">
            <span class="prompt-prefix">guest@fsociety:~$</span>
            <input type="text" id="user-input" placeholder="Aperte ENTER ou clique em ENVIAR..." autocomplete="off">
            <button class="send-btn" id="click-send">ENVIAR</button>
        </div>
    </div>

    <!-- Vinculação do arquivo JavaScript externo -->
    <script src="animaçao2.js"></script>
